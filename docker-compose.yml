# `docker compose up` -> Qdrant starts, `ingestion` downloads + embeds + upserts the
# dataset and exits 0, Qdrant keeps serving the populated `books` collection.
# `docker compose --profile mcp up -d mcp` additionally serves the search as MCP tools.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but not curl/wget.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  ingestion:
    build: .
    image: bookembed-ingestion:latest
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - dataset:/app/data
      - ./snapshots:/app/snapshots
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["ingest"]
    restart: "no"

  # Optional MCP server over streamable HTTP (http://localhost:8000/mcp). Behind a profile so
  # plain `docker compose up` is unchanged: `docker compose --profile mcp up -d mcp`.
  mcp:
    profiles: ["mcp"]
    image: bookembed-ingestion:latest
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "${MCP_HTTP_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["bookembed-mcp"]
    command: []
    restart: unless-stopped

volumes:
  qdrant_storage:
  dataset:
