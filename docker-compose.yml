# `docker compose up` -> Qdrant starts, `ingestion` downloads + embeds + upserts the
# dataset and exits 0, Qdrant keeps serving the populated `books` collection.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but not curl/wget.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  ingestion:
    build: .
    image: bookembed-ingestion:latest
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - dataset:/app/data
      - ./snapshots:/app/snapshots
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["ingest"]
    restart: "no"

volumes:
  qdrant_storage:
  dataset:
